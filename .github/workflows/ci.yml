name: Main CI

on:
  push:
    branches:
        - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write


jobs:
  main_job:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} #automated, not necesary to make a secret manually
      - name: Build and push to GHCR taskflow-backend Docker Image
        working-directory: ./backend
        run: |

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/taskflow-backend"

          docker build \
          -t ${IMAGE_NAME}:latest \
          -t ${IMAGE_NAME}:${SHORT_SHA} \
          .

          docker push ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${SHORT_SHA}
      - name: Build and push to GHCR taskflow-frontend Docker Image
        working-directory: ./frontend
        run: |

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/taskflow-frontend"

          docker build \
          -t ${IMAGE_NAME}:latest \
          -t ${IMAGE_NAME}:${SHORT_SHA} \
          .

          docker push ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${SHORT_SHA}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (Dev)
        working-directory: ./terraform/dev
        run: terraform init
      - name: Terraform Plan (Dev)
        working-directory: ./terraform/dev
        env:
          TF_VAR_database_name: ${{ secrets.TF_VAR_database_name }}
          TF_VAR_database_username: ${{ secrets.TF_VAR_database_username }}
          TF_VAR_database_password: ${{ secrets.TF_VAR_database_password }}
        run: terraform plan
      - name: Terraform Apply (Dev)
        working-directory: ./terraform/dev
        env:
          TF_VAR_database_name: ${{ secrets.TF_VAR_database_name }}
          TF_VAR_database_username: ${{ secrets.TF_VAR_database_username }}
          TF_VAR_database_password: ${{ secrets.TF_VAR_database_password }}
        run: terraform apply -auto-approve

      - name: Configure kubectl 
        run: |
            aws eks update-kubeconfig \
            --region eu-central-1 \
            --name taskflow-eks

      - name: Get RDS Endpoint
        id: rds
        working-directory: ./terraform/dev
        run: |
            echo "endpoint=$(terraform output -raw database_endpoint)" >> $GITHUB_OUTPUT

      - name: Create Backend ConfigMap
        run: |
            kubectl create configmap taskflow-backend-config \
            --from-literal=FLASK_ENV=production \
            --from-literal=FLASK_DEBUG=0 \
            --from-literal=LOG_LEVEL=INFO \
            --from-literal=PORT=5000 \
            --from-literal=CORS_ORIGINS=http://localhost \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Backend Secret
        run: |
            kubectl create secret generic taskflow-backend-secret \
            --from-literal=SECRET_KEY="${{ secrets.BACKEND_SECRET_KEY }}" \
            --from-literal=DATABASE_URL="postgresql://${{ secrets.TF_VAR_database_username }}:${{ secrets.TF_VAR_database_password }}@${{ steps.rds.outputs.endpoint }}:5432/${{ secrets.TF_VAR_database_name }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Backend 
        run: |
            kubectl apply -f kubernetes/deployment/backend_d.yaml

      - name: Deploy Backend Service
        run: |
            kubectl apply -f kubernetes/deployment/backend_s.yaml

      - name: Wait for Backend Rollout
        run: |
            kubectl rollout status deployment/backend-deployment --timeout=300s

      - name: Deploy Frontend
        run: |
            kubectl apply -f kubernetes/deployment/frontend_d.yaml

      - name: Deploy Frontend Service
        run: |
            kubectl apply -f kubernetes/deployment/frontend_s.yaml

      - name: Wait for Frontend Rollout
        run: |
            kubectl rollout status deployment/frontend-deployment --timeout=300s

      - name: Describe Pods
        if: failure()
        run: |
            kubectl describe pods


